<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BloodLink Portal</title><style>:root{--bg:#100708;--p:#1d0d0f;--p2:#271214;--t:#f7ece7;--m:#b98f95;--r:#e31837;--g:#79d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% 0,#6d1025,transparent 60%),var(--bg);color:var(--t);font:15px Inter,Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}nav{padding:18px 0;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center}.brand{font:600 24px Georgia}.red{color:var(--r)}main{padding:45px 0}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:var(--p);border:1px solid #ffffff18;border-radius:18px;padding:22px;margin-bottom:18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button,.btn,select,input{padding:11px;border-radius:9px;border:1px solid #ffffff18;background:var(--p2);color:var(--t)}.tabs button.active,.btn{background:var(--r);border-color:var(--r)}label{display:block;color:var(--m);font-size:12px;margin:13px 0 6px}input,select{width:100%}.btn{width:100%;font-weight:700;cursor:pointer}.muted{color:var(--m);line-height:1.6}.status{padding:10px;border-radius:9px;background:#ffffff06;margin-top:12px;color:var(--m)}.hide{display:none}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:var(--p2);padding:14px;border-radius:12px}.metric b{display:block;font-size:22px}.list{display:grid;gap:8px}.item{background:var(--p2);padding:13px;border-radius:12px}.pill{font-size:10px;color:var(--g);font-family:monospace}.danger{color:#ffd27a}@media(max-width:800px){.grid{grid-template-columns:1fr}.metric{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav><div class="brand"><span class="red">♥</span> BloodLink Portal</div><div id="user"></div></nav><main><div class="grid"><section class="card"><div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Register</button></div><form id="login"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn" style="margin-top:16px">Sign in</button></form><form id="register" class="hide"><label>Name</label><input name="display_name" minlength="2" maxlength="100" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="8" required><label>Role</label><select name="role"><option value="donor">Donor</option><option value="patient">Patient</option><option value="hospital">Hospital</option></select><button class="btn" style="margin-top:16px">Create account</button></form><div id="authStatus" class="status">Sign in to use protected workflows.</div></section><section><div id="welcome" class="card"><h1>One account. One clear workflow.</h1><p class="muted">BloodLink keeps donor, patient and hospital workflows behind role-based access while the public demo remains available for exploration.</p></div><div id="requestCard" class="card hide"><h2>Create blood request</h2><form id="request"><label>Blood group</label><select name="blood_group"><option>O-</option><option selected>O+</option><option>A-</option><option>A+</option><option>B-</option><option>B+</option><option>AB-</option><option>AB+</option></select><label>Latitude</label><input name="lat" type="number" step="any" value="13.0827" required><label>Longitude</label><input name="lon" type="number" step="any" value="80.2707" required><label>Radius (km)</label><input name="max_distance" type="number" min="1" max="500" value="30" required><label>Urgency</label><select name="urgency"><option>normal</option><option>high</option><option>critical</option></select><button class="btn" style="margin-top:16px">Create + Match</button></form><div id="requestStatus" class="status"></div><div id="matches" class="list"></div></div><div id="adminCard" class="card hide"><h2>Admin operations</h2><div class="metric"><div><b id="mContacts">—</b><span class="muted">contacts</span></div><div><b id="mAccepted">—</b><span class="muted">accepted</span></div><div><b id="mCompleted">—</b><span class="muted">completed</span></div></div></div></section></div></main></div><script>const api=(p,o={})=>fetch(p,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(o.headers||{})},...o}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d?.error?.message||`HTTP ${r.status}`);return d});const $=s=>document.querySelector(s);$('#loginTab').onclick=()=>swap(true);$('#registerTab').onclick=()=>swap(false);function swap(login){$('#login').classList.toggle('hide',!login);$('#register').classList.toggle('hide',login);$('#loginTab').classList.toggle('active',login);$('#registerTab').classList.toggle('active',!login)}$('#login').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e)))});render(d.user)}catch(x){$('#authStatus').textContent=x.message}};$('#register').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e)))});render(d.user)}catch(x){$('#authStatus').textContent=x.message}};async function render(user){$('#user').innerHTML=`${user.display_name} · ${user.role} <button id="out" class="btn" style="width:auto;margin-left:8px;padding:6px 10px">Sign out</button>`;$('#out').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};$('#authStatus').textContent='Signed in successfully.';if(['patient','hospital','admin'].includes(user.role))$('#requestCard').classList.remove('hide');if(user.role==='admin'){ $('#adminCard').classList.remove('hide'); loadMetrics() }}$('#request').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e));f.lat=Number(f.lat);f.lon=Number(f.lon);f.max_distance=Number(f.max_distance);try{const created=await api('/api/requests',{method:'POST',body:JSON.stringify(f)});const match=await api('/api/match-donors',{method:'POST',body:JSON.stringify(f)});$('#requestStatus').textContent=`Request #${created.request_id} created · ${match.matches.length} candidates found.`;$('#matches').innerHTML=match.matches.map((d,i)=>`<div class="item"><b>#${i+1} ${d.name}</b><div class="muted">${d.blood_group} · ${d.distance_km} km · response ${(d.ml_response_probability*100).toFixed(0)}%</div><span class="pill">${(d.match_reasons||[]).join(' · ')}</span></div>`).join('')}catch(x){$('#requestStatus').textContent=x.message}};async function loadMetrics(){try{const d=await api('/api/admin/metrics');$('#mContacts').textContent=d.total_contacts;$('#mAccepted').textContent=d.accepted;$('#mCompleted').textContent=d.completed}catch{}}api('/api/auth/me').then(d=>{if(d.user)render(d.user)})</script></body></html>
